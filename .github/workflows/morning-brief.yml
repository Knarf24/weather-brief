name: Morning brief

# Checks every hour and sends only at the SEND_HOURS (default 6,12,17: about 06:30, 12:30 and 17:30)
# in the city's own time zone, so it stays right through daylight-saving changes.
# Set the repository variables CITY and SEND_HOURS (e.g. 7 or 6,12,17) to change place and times. GitHub may start it a few minutes late.
on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      city:
        description: "City (leave empty to use the CITY variable)"
        required: false
      send:
        description: "Send it (untick to only show the brief in the log)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make and send the brief
        env:
          CITY: ${{ inputs.city || vars.CITY || 'Salisbury, North Carolina' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          BRIEF_STYLE: ${{ vars.BRIEF_STYLE }}
          SEND_HOURS: ${{ vars.SEND_HOURS || vars.SEND_HOUR || '6,12,17' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python send_brief.py --send --at-hour "$SEND_HOURS"
          elif [ "${{ inputs.send }}" = "false" ]; then
            python send_brief.py          # just print it
          else
            python send_brief.py --send   # "Run workflow" button: send right now
          fi
